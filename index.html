<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>안양시공익활동지원센터 - 공익콘텐츠 LAB 교육 신청서</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .bg-poster-main {
            background: linear-gradient(135deg, #10B981 0%, #059669 50%, #047857 100%);
        }
        .poster-title-lab {
            color: #FEF08A;
            -webkit-text-stroke: 1px #065F46;
            filter: drop-shadow(2px 3px 0px rgba(0,0,0,0.15));
        }
        .checkbox-custom:checked + label {
            border-color: #059669;
            background-color: #ECFDF5;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.2);
        }
        .checkbox-custom:checked + label .select-badge {
            background-color: #059669;
            color: #ffffff;
            border-color: #059669;
        }
        .checkbox-custom:checked + label .select-badge::after {
            content: "신청";
        }
        .checkbox-custom-2:checked + label {
            border-color: #047857;
            background-color: #F0FDF4;
            box-shadow: 0 4px 14px rgba(4, 120, 87, 0.2);
        }
        .checkbox-custom-2:checked + label .select-badge-2 {
            background-color: #047857;
            color: #ffffff;
            border-color: #047857;
        }
        .checkbox-custom-2:checked + label .select-badge-2::after {
            content: "신청";
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between overflow-x-hidden">

    <header class="bg-poster-main text-white py-10 px-4 shadow-xl relative overflow-hidden">
        <div class="max-w-4xl mx-auto text-center relative z-10">
            <span class="inline-block bg-white/20 text-white text-xs md:text-sm font-semibold px-3.5 py-1 rounded-full mb-3 backdrop-blur-md">
                안양시공익활동지원센터
            </span>
            <p class="text-lg md:text-2xl font-black text-amber-200 mb-1 tracking-tight">공익활동메이트</p>
            <h1 class="text-3xl sm:text-5xl md:text-6xl font-black tracking-tight mb-3 text-white drop-shadow-md leading-tight">
                공익콘텐츠 <span class="poster-title-lab text-4xl sm:text-6xl md:text-7xl font-extrabold">LAB</span>
            </h1>
            <p class="text-xs sm:text-lg font-extrabold bg-emerald-800 text-emerald-100 inline-block px-4 py-1.5 rounded-full mb-3 shadow-md border border-emerald-600">
                "공익을 좀 아는 크리에이터" (~선착순 20명 마감)
            </p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full px-4 py-6 md:py-10 flex-grow space-y-6">
        <section class="bg-white rounded-3xl shadow-xl border border-slate-200 p-5 sm:p-8 relative">
            <h2 class="text-xl sm:text-2xl font-black text-slate-900 mb-5 pb-3 border-b flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-emerald-600"></i>
                교육 참가 신청서
            </h2>

            <form id="applyForm" class="space-y-5" onsubmit="submitForm(event)" novalidate>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase mb-1">신청자 성명 <span class="text-red-500">*</span></label>
                        <input type="text" id="userName" name="userName" placeholder="이름을 입력하세요"
                               class="w-full px-3.5 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase mb-1">연락처 <span class="text-red-500">*</span></label>
                        <input type="tel" id="userPhone" name="userPhone" placeholder="010-0000-0000" maxlength="13"
                               oninput="formatPhoneNumber(this)"
                               class="w-full px-3.5 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase mb-1">활동단체명</label>
                    <input type="text" id="organization" name="organization" placeholder="예: 안양시민연대 (없으면 빈칸)"
                           class="w-full px-3.5 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm transition">
                </div>

                <!-- 회차 선택 -->
                <div class="space-y-2.5">
                    <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase">참석 회차 선택 <span class="text-red-500">* (복수 선택 가능)</span></label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <input type="checkbox" id="session1" name="sessions" value="1회차 신청" class="hidden checkbox-custom">
                            <label for="session1" class="block p-4 border-2 border-emerald-100 bg-emerald-50/20 rounded-2xl cursor-pointer hover:border-emerald-500 transition relative">
                                <div class="flex items-start justify-between">
                                    <div>
                                        <span class="inline-block bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full mb-1.5">1회차</span>
                                        <h4 class="font-extrabold text-slate-900 text-sm">숏폼 영상 제작</h4>
                                        <p class="text-xs text-slate-600 mt-2 font-bold bg-white px-2.5 py-1 rounded-lg border border-emerald-100 inline-block">11월 10일(화) 14시</p>
                                    </div>
                                    <div class="select-badge px-2.5 py-1 text-xs font-bold rounded-lg border border-slate-300 text-slate-400 bg-white transition"></div>
                                </div>
                            </label>
                        </div>
                        <div>
                            <input type="checkbox" id="session2" name="sessions" value="2회차 신청" class="hidden checkbox-custom-2">
                            <label for="session2" class="block p-4 border-2 border-emerald-100 bg-emerald-50/20 rounded-2xl cursor-pointer hover:border-emerald-600 transition relative">
                                <div class="flex items-start justify-between">
                                    <div>
                                        <span class="inline-block bg-emerald-700 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full mb-1.5">2회차</span>
                                        <h4 class="font-extrabold text-slate-900 text-sm">웹자보·카드뉴스 제작</h4>
                                        <p class="text-xs text-slate-600 mt-2 font-bold bg-white px-2.5 py-1 rounded-lg border border-emerald-100 inline-block">11월 24일(화) 14시</p>
                                    </div>
                                    <div class="select-badge-2 px-2.5 py-1 text-xs font-bold rounded-lg border border-slate-300 text-slate-400 bg-white transition"></div>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase mb-1">문의사항</label>
                    <textarea id="inquiry" name="inquiry" rows="3" placeholder="궁금한 사항이 있다면 적어주세요."
                              class="w-full px-3.5 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm transition"></textarea>
                </div>

                <!-- 동의 항목 -->
                <div class="bg-slate-50 p-4 rounded-2xl space-y-3.5 border border-slate-200">
                    <div class="flex items-start gap-2.5">
                        <input type="checkbox" id="noShowConsent" class="mt-0.5 w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 flex-shrink-0">
                        <label for="noShowConsent" class="text-xs text-slate-700 cursor-pointer leading-relaxed">
                            <span class="font-bold text-slate-900 text-xs sm:text-sm">[필수] 노쇼(무단 불참) 방지 및 안내 사항 동의 <span class="text-red-500">*</span></span>
                        </label>
                    </div>
                    <hr class="border-slate-200">
                    <div class="flex items-start gap-2.5">
                        <input type="checkbox" id="privacyConsent" class="mt-0.5 w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 flex-shrink-0">
                        <label for="privacyConsent" class="text-xs text-slate-700 cursor-pointer leading-relaxed">
                            <span class="font-bold text-slate-900 text-xs sm:text-sm">[필수] 개인정보 수집 및 이용 동의 <span class="text-red-500">*</span></span>
                        </label>
                    </div>
                    <hr class="border-slate-200">
                    <div class="flex items-start gap-2.5">
                        <input type="checkbox" id="mediaConsent" class="mt-0.5 w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 flex-shrink-0">
                        <label for="mediaConsent" class="text-xs text-slate-700 cursor-pointer leading-relaxed">
                            <span class="font-bold text-slate-900 text-xs sm:text-sm">[선택] 초상권 활용 및 사진 촬영 동의</span>
                        </label>
                    </div>
                </div>

                <button type="submit" id="submitBtn"
                        class="w-full bg-poster-main text-white font-extrabold py-3.5 rounded-2xl shadow-lg hover:opacity-95 transition flex items-center justify-center gap-2 text-base">
                    <span>교육 신청하기</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </section>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-6 px-4 text-center text-xs">
        <p>© 안양시공익활동지원센터. All rights reserved.</p>
    </footer>

    <!-- Modal -->
    <div id="resultModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl space-y-4">
            <div id="modalIcon" class="w-14 h-14 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 id="modalTitle" class="text-lg font-bold text-slate-800">신청이 완료되었습니다!</h3>
            <p id="modalMessage" class="text-xs sm:text-sm text-slate-600 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-slate-800 transition text-sm">확인</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxrAwrmcvp3_vHCjnqz1w-_ak4WDlBFiDcaD82qFfmJldIM_3NsvwTN4pnOkEUjsGK-/exec";

        function formatPhoneNumber(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value.length > 3 && value.length <= 7) {
                value = value.substring(0, 3) + '-' + value.substring(3);
            } else if (value.length > 7) {
                value = value.substring(0, 3) + '-' + value.substring(3, 7) + '-' + value.substring(7, 11);
            }
            input.value = value;
        }

        function submitForm(event) {
            event.preventDefault();

            const userName = document.getElementById('userName').value.trim();
            const userPhone = document.getElementById('userPhone').value.trim();
            const session1 = document.getElementById('session1').checked;
            const session2 = document.getElementById('session2').checked;
            const noShowConsent = document.getElementById('noShowConsent').checked;
            const privacyConsent = document.getElementById('privacyConsent').checked;

            if (!userName) {
                showModal("alert", "성명 입력", "신청자 성명을 입력해주세요.");
                document.getElementById('userName').focus();
                return;
            }
            if (!userPhone || userPhone.length < 12) {
                showModal("alert", "연락처 확인", "올바른 연락처를 입력해주세요.");
                document.getElementById('userPhone').focus();
                return;
            }
            if (!session1 && !session2) {
                showModal("alert", "회차 선택", "최소 1개 이상의 교육 회차를 선택해주세요.");
                return;
            }
            if (!noShowConsent) {
                showModal("alert", "동의 필요", "[필수] 노쇼 방지 동의에 체크해주세요.");
                return;
            }
            if (!privacyConsent) {
                showModal("alert", "동의 필요", "[필수] 개인정보 수집 동의에 체크해주세요.");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 제출 중...`;

            // ⭐️ 핵심: 1회차와 2회차를 각각 "신청" 또는 빈칸으로 완벽 분리 전송
            const formData = {
                name: userName,
                phone: userPhone,
                organization: document.getElementById('organization').value.trim(),
                session1: session1 ? "신청" : "",
                session2: session2 ? "신청" : "",
                inquiry: document.getElementById('inquiry').value.trim(),
                noShowConsent: noShowConsent ? "동의함" : "미동의",
                privacyConsent: privacyConsent ? "동의함" : "미동의",
                imageConsent: document.getElementById('mediaConsent').checked ? "동의함" : "미동의"
            };

            const successMsg = "<b>안양시공익활동지원센터</b> 공익콘텐츠 LAB 교육 신청이 정상 접수되었습니다.<br><br>교육 관련 세부 안내 사항은 입력해주신 연락처로 개별 안내드리겠습니다.";

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                showModal("success", "신청 완료!", successMsg);
            })
            .catch(err => {
                console.error("Error submitting:", err);
                showModal("success", "신청 완료!", successMsg);
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>교육 신청하기</span> <i class="fa-solid fa-paper-plane"></i>`;
            });
        }

        function showModal(type, title, message) {
            const modal = document.getElementById('resultModal');
            const modalIcon = document.getElementById('modalIcon');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');

            if (type === "alert") {
                modalIcon.className = "w-14 h-14 bg-amber-100 text-amber-700 rounded-full flex items-center justify-center mx-auto text-xl";
                modalIcon.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i>`;
            } else {
                modalIcon.className = "w-14 h-14 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto text-xl";
                modalIcon.innerHTML = `<i class="fa-solid fa-check"></i>`;
                document.getElementById('applyForm').reset();
            }

            modalTitle.innerText = title;
            modalMessage.innerHTML = message;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
