<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .bg-poster-main {
            background: linear-gradient(135deg, #10B981 0%, #059669 50%, #047857 100%);
        }
        .poster-title-lab {
            color: #FEF08A;
            -webkit-text-stroke: 1px #065F46;
            filter: drop-shadow(2px 3px 0px rgba(0,0,0,0.15));
        }
        .checkbox-custom:checked + label {
            border-color: #059669;
            background-color: #ECFDF5;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.2);
        }
        .checkbox-custom:checked + label .select-badge {
            background-color: #059669;
            color: #ffffff;
            border-color: #059669;
        }
        .checkbox-custom:checked + label .select-badge::after {
            content: "신청";
        }
        .checkbox-custom-2:checked + label {
            border-color: #047857;
            background-color: #F0FDF4;
            box-shadow: 0 4px 14px rgba(4, 120, 87, 0.2);
        }
        .checkbox-custom-2:checked + label .select-badge-2 {
            background-color: #047857;
            color: #ffffff;
            border-color: #047857;
        }
        .checkbox-custom-2:checked + label .select-badge-2::after {
            content: "신청";
        }
        /* 마감된 회차 */
        input:disabled + label {
            opacity: .5;
            cursor: not-allowed;
            filter: grayscale(1);
        }
        input:disabled + label .select-badge::after,
        input:disabled + label .select-badge-2::after {
            content: "마감";
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between overflow-x-hidden">

    <header class="bg-poster-main text-white py-10 px-4 shadow-xl relative overflow-hidden">
        <div class="max-w-4xl mx-auto text-center relative z-10">

                안양시공익활동지원센터
            </span>
            <p class="text-lg md:text-2xl font-black text-amber-200 mb-1 tracking-tight">공익활동메이트</p>
            <h1 class="text-3xl sm:text-5xl md:text-6xl font-black tracking-tight mb-3 text-white drop-shadow-md leading-tight">
                공익콘텐츠 <span class="poster-title-lab text-4xl sm:text-6xl md:text-7xl font-extrabold">LAB</span>
            </h1>
            <p class="text-xs sm:text-lg font-extrabold bg-emerald-800 text-emerald-100 inline-block px-4 py-1.5 rounded-full mb-3 shadow-md border border-emerald-600">

            </p>

    <main class="max-w-4xl mx-auto w-full px-4 py-6 md:py-10 flex-grow space-y-6">

            <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 text-center">
                <div class="w-10 h-10 bg-emerald-100 text-emerald-700 rounded-xl flex items-center justify-center mx-auto mb-2.5 text-lg">
                    <i class="fa-solid fa-users"></i>
                </div>

            </div>

        <section class="bg-white rounded-3xl shadow-xl border border-slate-200 p-5 sm:p-8 relative">
            <h2 class="text-xl sm:text-2xl font-black text-slate-900 mb-5 pb-3 border-b flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-emerald-600"></i>
                교육 참가 신청서
            </h2>

            <form id="applyForm" class="space-y-5" onsubmit="submitForm(event)" novalidate>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase mb-1">신청자 성명 <span class="text-red-500">*</span></label>
                        <input type="text" id="userName" name="userName" placeholder="이름을 입력하세요" maxlength="30"

                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase mb-1">연락처 (휴대폰 번호) <span class="text-red-500">*</span></label>
                        <input type="tel" id="userPhone" name="userPhone" placeholder="010-0000-0000" maxlength="13"
                               oninput="formatPhoneNumber(this)"
                               class="w-full px-3.5 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase mb-1">이메일 주소 <span class="text-slate-400 font-normal">(신청 확인 메일용)</span></label>
                        <input type="email" id="userEmail" name="userEmail" placeholder="example@email.com" maxlength="100"
                               class="w-full px-3.5 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase mb-1">활동단체명 <span class="text-slate-400 font-normal">(개인 시 공란)</span></label>
                        <input type="text" id="organization" name="organization" placeholder="예: 안양시민연대 (없으면 공란)" maxlength="50"
                               class="w-full px-3.5 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </div>
                </div>

                <div class="space-y-2.5">
                    <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase">참석 회차 선택 <span class="text-red-500">* (복수 선택 가능)</span></label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <input type="checkbox" id="session1" name="sessions" value="1회차 신청" class="hidden checkbox-custom">
                            <label for="session1" class="block p-4 border-2 border-emerald-100 bg-emerald-50/20 rounded-2xl cursor-pointer hover:border-emerald-500 transition relative">
                                <div class="flex items-start justify-between">
                                    <div class="pr-2">
                                        <span class="inline-block bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full mb-1.5">1회차</span>
                                        <h4 class="font-extrabold text-slate-900 text-sm sm:text-base">숏폼 영상 제작</h4>
                                        <p class="text-xs text-slate-600 mt-2 font-bold bg-white px-2 py-1 rounded-lg border inline-block">11월 10일(화) 14시 ~ 18시</p>
                                        <p id="seat1" class="text-xs text-emerald-700 font-bold mt-1.5"></p>
                                    </div>
                                    <div class="select-badge px-2.5 py-1 text-xs font-bold rounded-lg border border-slate-300 text-slate-400 bg-white transition flex-shrink-0"></div>
                                </div>
                            </label>
                        </div>
                        <div>
                            <input type="checkbox" id="session2" name="sessions" value="2회차 신청" class="hidden checkbox-custom-2">
                            <label for="session2" class="block p-4 border-2 border-emerald-100 bg-emerald-50/20 rounded-2xl cursor-pointer hover:border-emerald-600 transition relative">
                                <div class="flex items-start justify-between">
                                    <div class="pr-2">
                                        <span class="inline-block bg-emerald-700 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full mb-1.5">2회차</span>
                                        <h4 class="font-extrabold text-slate-900 text-sm sm:text-base">웹자보·카드뉴스 제작</h4>
                                        <p class="text-xs text-slate-600 mt-2 font-bold bg-white px-2 py-1 rounded-lg border inline-block">11월 24일(화) 14시 ~ 18시</p>
                                        <p id="seat2" class="text-xs text-emerald-700 font-bold mt-1.5"></p>
                                    </div>
                                    <div class="select-badge-2 px-2.5 py-1 text-xs font-bold rounded-lg border border-slate-300 text-slate-400 bg-white transition flex-shrink-0"></div>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase mb-1">문의사항 및 남기실 말씀</label>
                    <textarea id="inquiry" name="inquiry" rows="3" placeholder="궁금한 사항이 있다면 적어주세요." maxlength="1000"
                              class="w-full px-3.5 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm"></textarea>
                </div>

                <div class="bg-slate-50 p-4 rounded-2xl space-y-3.5 border border-slate-200">
                    <div class="flex items-start gap-2.5 bg-amber-50/80 p-3.5 rounded-xl border border-amber-200">
                        <input type="checkbox" id="noShowConsent" class="mt-0.5 w-4.5 h-4.5 text-amber-600 rounded focus:ring-amber-500 flex-shrink-0 cursor-pointer">
                        <label for="noShowConsent" class="text-xs sm:text-sm text-slate-800 cursor-pointer leading-relaxed">
                            <span class="font-bold text-amber-950 text-xs sm:text-sm">[필수] 교육 참석 및 무단 불참에 따른 불이익 안내 동의 <span class="text-red-500">*</span></span><br>
                            <span class="text-slate-600 text-xs">
                                • 신청한 교육에 성실히 참석하며, 참석이 어려운 경우 교육 시작 2일 전까지 사전 취소하겠습니다.<br>
                                • 사전 연락 없이 교육에 불참할 경우, 향후 센터 교육 신청 및 참여가 제한될 수 있음에 동의합니다.
                            </span>
                        </label>
                    </div>

                    <div class="flex items-start gap-2.5 bg-white p-3.5 rounded-xl border border-slate-200">
                        <input type="checkbox" id="privacyConsent" class="mt-0.5 w-4.5 h-4.5 text-emerald-600 rounded focus:ring-emerald-500 flex-shrink-0 cursor-pointer">
                        <label for="privacyConsent" class="text-xs sm:text-sm text-slate-800 cursor-pointer leading-relaxed">
                            <span class="font-bold text-slate-900 text-xs sm:text-sm">[필수] 개인정보 수집 및 이용 동의 <span class="text-red-500">*</span></span><br>
                            <span class="text-slate-600 text-xs">
                                • <b>수집 항목:</b> 성명, 연락처, 이메일, 활동단체명<br>
                                • <b>목적:</b> 교육 참가자 본인 확인, 안내 발송, 관리<br>
                                • <b>보유 기간:</b> <b class="text-slate-900">교육 종료 후 사업 결과 보고 완료 시 지체 없이 파기</b><br>
                                • 동의를 거부할 수 있으나, 거부 시 교육 신청이 제한됩니다.
                            </span>
                        </label>
                    </div>

                    <div class="flex items-start gap-2.5 p-1">
                        <input type="checkbox" id="mediaConsent" class="mt-0.5 w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 flex-shrink-0 cursor-pointer">
                        <label for="mediaConsent" class="text-xs sm:text-sm text-slate-700 cursor-pointer leading-relaxed">
                            <span class="font-bold text-slate-900 text-xs sm:text-sm">[선택] 초상권 활용 및 사진 촬영 동의</span><br>
                            • <b>목적:</b> 교육 현장 기록 및 센터 홈페이지, 블로그, 보도자료 게재<br>
                            • 동의하지 않아도 교육 신청이 가능합니다.
                        </label>
                    </div>
                </div>

                <button type="submit" id="submitBtn"
                        class="w-full bg-poster-main text-white font-extrabold py-3.5 rounded-2xl shadow-lg hover:opacity-95 transition flex items-center justify-center gap-2 text-base disabled:opacity-60 disabled:cursor-wait">
                    <span>교육 신청하기</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </section>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-6 px-4 text-center text-xs">
        <p class="max-w-4xl mx-auto leading-relaxed">© 안양시공익활동지원센터. All rights reserved.</p>
    </footer>

    <div id="resultModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl space-y-4">
            <div id="modalIcon" class="w-14 h-14 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 id="modalTitle" class="text-lg font-bold text-slate-800">신청이 완료되었습니다!</h3>
            <p id="modalMessage" class="text-xs sm:text-sm text-slate-600 leading-relaxed">신청이 정상 접수되었습니다.</p>
            <button onclick="closeModal()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-slate-800 transition text-sm">확인</button>
        </div>
    </div>

    <script>
        // Apps Script를 새로 배포하면 바뀐 URL로 교체하세요
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxrAwrmcvp3_vHCjnqz1w-_ak4WDlBFiDcaD82qFfmJldIM_3NsvwTN4pnOkEUjsGK-/exec";

        function formatPhoneNumber(input) {
            let value = input.value.replace(/[^0-9]/g, '').substring(0, 11);
            if (value.length > 3 && value.length <= 7) {
                value = value.substring(0, 3) + '-' + value.substring(3);
            } else if (value.length > 7) {
                value = value.substring(0, 3) + '-' + value.substring(3, 7) + '-' + value.substring(7);
            }
            input.value = value;
        }

        // 남은 자리 표시 + 마감 회차 잠금
        function loadSeats() {
            fetch(SCRIPT_URL)
                .then(r => r.json())
                .then(d => {
                    if (!d.ok) return;
                    [1, 2].forEach(i => {
                        const cap = d.capacity[i];
                        if (!cap) return;
                        const left = Math.max(cap - d.counts[i], 0);
                        const seat = document.getElementById('seat' + i);
                        const box = document.getElementById('session' + i);
                        if (left > 0) {
                            seat.textContent = `남은 자리 ${left}명 / 정원 ${cap}명`;
                            box.disabled = false;
                        } else {
                            seat.textContent = '선착순 마감';
                            seat.className = 'text-xs text-red-500 font-bold mt-1.5';
                            box.checked = false;
                            box.disabled = true;
                        }
                    });
                })
                .catch(() => {});
        }
        loadSeats();

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function submitForm(event) {
            event.preventDefault();

            const userName = document.getElementById('userName').value.trim();
            const userPhone = document.getElementById('userPhone').value.trim();
            const userEmail = document.getElementById('userEmail').value.trim();
            const session1 = document.getElementById('session1').checked;
            const session2 = document.getElementById('session2').checked;
            const noShowConsent = document.getElementById('noShowConsent').checked;
            const privacyConsent = document.getElementById('privacyConsent').checked;

            if (!userName) { showModal("alert", "성명을 입력해주세요.", "성명은 필수 입력 사항입니다."); document.getElementById('userName').focus(); return; }
            if (!/^01[016789]-?\d{3,4}-?\d{4}$/.test(userPhone)) { showModal("alert", "연락처를 확인해주세요.", "휴대폰 번호를 정확히 입력해 주세요."); document.getElementById('userPhone').focus(); return; }
            if (userEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(userEmail)) { showModal("alert", "이메일을 확인해주세요.", "이메일 주소 형식이 올바르지 않습니다."); document.getElementById('userEmail').focus(); return; }
            if (!session1 && !session2) { showModal("alert", "회차를 선택해주세요.", "최소 1개 이상의 회차를 선택하셔야 합니다."); return; }
            if (!noShowConsent) { showModal("alert", "노쇼 방지 동의 필요", "[필수] 교육 참석 및 무단 불참에 따른 불이익 안내 동의에 체크해주세요."); return; }
            if (!privacyConsent) { showModal("alert", "개인정보 동의 필요", "[필수] 개인정보 수집 및 이용 동의에 체크해주세요."); return; }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 제출 중...`;

            const formData = {
                name: userName,
                phone: userPhone,
                email: userEmail,
                organization: document.getElementById('organization').value.trim(),
                session1: session1,
                session2: session2,
                inquiry: document.getElementById('inquiry').value.trim(),
                noShowConsent: noShowConsent ? "동의함" : "미동의",
                privacyConsent: privacyConsent ? "동의함" : "미동의",
                imageConsent: document.getElementById('mediaConsent').checked ? "동의함" : "미동의"
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    const mailText = data.mailSent ? "입력하신 메일로 신청 확인 안내를 보내드렸습니다." : "교육 전 연락처로 안내드리겠습니다.";
                    showModal("success", "신청 완료!", "정상 접수되었습니다.<br>" + mailText);
                    document.getElementById('applyForm').reset();
                } else {
                    showModal("alert", "신청이 접수되지 않았습니다", escapeHtml(data.message || "다시 시도해 주세요."));
                }
                loadSeats();
            })
            .catch(err => {
                console.error("Error:", err);
                // 실패를 '완료'로 보여주지 않음
                showModal("alert", "전송 오류", "네트워크 문제로 접수 여부를 확인하지 못했습니다.<br>잠시 후 다시 시도하시거나 <b>031-441-3904</b>로 문의해 주세요.");
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>교육 신청하기</span> <i class="fa-solid fa-paper-plane"></i>`;
            });
        }

        function showModal(type, title, message) {
            const modal = document.getElementById('resultModal');
            const modalIcon = document.getElementById('modalIcon');

            if (type === "alert") {
                modalIcon.className = "w-14 h-14 bg-amber-100 text-amber-700 rounded-full flex items-center justify-center mx-auto text-xl";
                modalIcon.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i>`;
            } else {
                modalIcon.className = "w-14 h-14 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto text-xl";
                modalIcon.innerHTML = `<i class="fa-solid fa-check"></i>`;
            }

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerHTML = message;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
